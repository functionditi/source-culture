name: Deploy notebook to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v6
        id: pages
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - name: Check the static export
        run: python -m unittest discover -s tests -p test_pages.py -v
      - name: Build the read-only notebook
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: python -m server.build_pages --base-path "${PAGES_BASE_PATH}/"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
